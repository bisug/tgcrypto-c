name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    paths-ignore: ["*.md", "**/*.md", "benchmarks/**", "COPYING*", "NOTICE"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install pytest pycryptodome cryptography

      - name: Build and install extension
        run: python -m pip install .

      - name: Run tests
        run: python -m pytest

  sdist:
    name: Build source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build sdist
        run: |
          python -m pip install build==1.6.1
          python -m build --sdist --outdir dist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # One native runner per architecture; no emulation or cross-compiling.
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15-intel, macos-26]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore cibuildwheel tool cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/cibw-cache
          key: cibw-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: cibw-${{ runner.os }}-${{ runner.arch }}-

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3
        env:
          CIBW_CACHE_PATH: ${{ runner.temp }}/cibw-cache
          CIBW_TEST_REQUIRES: pytest pycryptodome
          CIBW_TEST_COMMAND: python -m pytest {project}/tests

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: [test, sdist, build_wheels]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/tgcrypto-c
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "*"
          merge-multiple: true

      - name: Check distribution metadata
        run: |
          python -m pip install twine==7.0.0
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
