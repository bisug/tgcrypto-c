name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"

      - name: Build distributions
        run: |
          python -m pip install -U build
          python -m build --sdist --outdir dist

      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One native runner per architecture: cibuildwheel builds and tests
        # each wheel on its own arch, so no emulation or cross-compiling.
        os:
          - ubuntu-latest        # Linux x86_64
          - ubuntu-24.04-arm     # Linux aarch64
          - windows-latest       # Windows AMD64
          - macos-15-intel       # macOS x86_64
          - macos-latest         # macOS arm64

    steps:
      - name: Check out release
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.2.0

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -m pytest {project}/tests
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl

  publish:
    name: Publish tgcrypto-c to PyPI
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tgcrypto-c
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: "*"
          merge-multiple: true

      - name: Check distribution metadata
        run: |
          python -m pip install -U twine
          python -m twine check dist/*

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
